services:
  local:
    url: http://0.0.0.0:8181

bundles:
  opamp:
    service: local
    resource: /policies
    persist: true
    polling:
      min_delay_seconds: 10
      max_delay_seconds: 60

default_access_rules:
  - path: /v1/data
    resource: allow
  - path: /v1/policies
    resource: allow

