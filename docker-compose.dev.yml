# Local development overlay. It is deliberately **not** named
# `docker-compose.override.yml`: the base file pins released images for deployment,
# and silently replacing them with a local build would make `docker compose up` mean
# different things to a developer and an operator.
#
# Use it explicitly:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# The base services declare only `image:`, which is why `docker compose up --build`
# on its own does nothing: Compose has no `build:` section to build. This overlay
# adds one, tags the result locally (`:dev`), and bind-mounts the source so edits
# reload without a rebuild.
#
# The console is the exception: `web/` is compiled to static files, so a bind mount
# would change nothing a browser can see. Frontend hot reload is vite on the host
# (`cd web && npm run dev` -> 8501, or 8502 when this stack owns 8501), or the
# `console` profile below when the whole loop has to stay in containers.

services:
  server:
    image: opamp-server-py-server:dev
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      # Read-only source mounts cannot take a __pycache__ write; skip bytecode.
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      # Source over the image. The named data volume from the base file stays at
      # /app/data; these mounts only shadow the code that the image copied in.
      - ./server:/app/server:ro
      - ./proto:/app/proto:ro
      - ./policies:/app/policies:ro
      - ./collector:/app/collector:ro
    command:
      - python
      - -m
      - uvicorn
      - server.main:app
      - --host
      - 0.0.0.0
      - --port
      - "4320"
      - --ws-max-size
      - "67108864"
      - --reload
      - --reload-dir
      - /app/server
      - --reload-dir
      - /app/proto
      - --reload-dir
      - /app/policies

  ui:
    image: opamp-server-py-ui:dev
    build:
      context: .
      dockerfile: Dockerfile.ui
    # No source mount: the image IS the build (`npm run build` inside it). Editing
    # `web/` therefore needs `--build`, which is the honest behaviour for a static
    # bundle — for an edit/refresh loop use vite, on the host or via `console`
    # below, not this service.

  # vite's dev server for frontend work that must stay containerised. It is
  # opt-in and lands on 8502, never 8501: the built `ui` above owns the product
  # port, and two services publishing one port is a race, not a feature.
  #   docker compose --profile console up console
  # `npm ci` runs on first boot only — the named volume keeps node_modules across
  # restarts. OPAMP_API_TARGET points the /api proxy at the compose server.
  console:
    image: node:22-alpine
    container_name: opamp-console
    working_dir: /app/web
    environment:
      - OPAMP_API_TARGET=http://server:4320
    ports:
      - "127.0.0.1:8502:8501"
    volumes:
      - ./web:/app/web
      - console-node-modules:/app/web/node_modules
    command:
      - sh
      - -c
      - |
        if [ ! -d node_modules/vite ]; then npm ci --no-audit --no-fund; fi
        exec npm run dev -- --host 0.0.0.0 --port 8501
    depends_on:
      server:
        condition: service_healthy
    networks:
      - opamp-network
    profiles:
      - console

volumes:
  # node_modules for the `console` dev server (above). A named volume, so the
  # bind-mounted source tree never sees a host/node_modules collision and the
  # install survives restarts. `docker compose down -v` clears it like any other.
  console-node-modules:
