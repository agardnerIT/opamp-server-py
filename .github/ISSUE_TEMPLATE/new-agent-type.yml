name: "Add a new agent type"
description: "Nominate a project this server should recognise — we'll reach out and build the profile together"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for nominating! That's all this form needs — we'll reach out, connect the
        project to a server, and see what the profile needs from there.

  - type: input
    id: project
    attributes:
      label: Project name
      description: "What should this server call it? e.g. 'Fluent Bit', 'osquery', 'Vector'"
    validations:
      required: true

  - type: input
    id: link
    attributes:
      label: Link to the project
      description: "Preferably GitHub."
    validations:
      required: true
