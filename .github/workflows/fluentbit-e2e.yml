name: Fluent Bit e2e

# The other half of #113: a *non-OTel* agent, end to end (#123).
#
# `collector-e2e.yml` proves the OpenTelemetry path. This one proves #117's claim that
# the server is not collector-shaped: a real Fluent Bit, supervised by
# `opamp-observe/opamp-core`, registers, is **identified** from its own description, is
# inventoried from its **INI config**, and takes a pushed config that its profile's
# rules judged — with no collector vocabulary in the exchange.
#
# Non-blocking no longer: the job gates. It needs Docker, two downloads (Fluent Bit, the
# consumer wheel) and a network, so it can still go red for reasons that are not this
# repository's fault — but `continue-on-error: true` hid a real breakage for four runs
# (#138: the server refused to start, the run still reported green), which is worse.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: fluentbit-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fluentbit-e2e:
    name: Fluent Bit (opamp-core) against the server
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Pin both halves: this is the client implementation the profile's rules were
      # written against (#123's spike), so a floating version would hide the thing
      # under test.
      FLUENT_BIT_VERSION: "3.2.10"
      OPAMP_CORE_REF: "v0.6"
      SERVER_URL: http://localhost:4320
      ADMIN_PASSWORD: fluentbit-e2e-admin-pw-123

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install server dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start the server
        # A pushing server with the local-development posture overrides: this workflow
        # is about the agent, not about TLS. A fresh DATA_DIR keeps the run hermetic.
        #
        # There is deliberately no `OPAMP_AGENT_AUTH` here. `off` stopped being a
        # supported value in #125: the server now *refuses to start* on it, and since
        # the refusal happens in the lifespan hook the symptom is a silent port, not an
        # error — that is what made #138 look like a flaky timeout.
        env:
          OPAMP_CONFIG_PUSH_ENABLED: "true"
          OPAMP_ALLOW_INSECURE_CONFIG_PUSH: "true"
          # This job pushes a config body and never has a key, so say so out loud
          # rather than let /health report `unconfigured` while storing plaintext.
          OPAMP_ALLOW_PLAINTEXT_CONFIG_STORAGE: "true"
        run: |
          mkdir -p "$RUNNER_TEMP/opamp"
          DATA_DIR="$RUNNER_TEMP/opamp" nohup python -m uvicorn server.main:app \
            --host 127.0.0.1 --port 4320 > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 60); do
            curl --max-time 20 --connect-timeout 5 -sf "$SERVER_URL/health" >/dev/null && break
            sleep 1
          done
          # Ask for the health payload explicitly instead of piping an unchecked curl
          # into `json.tool`: an empty body there reported "Expecting value: line 1
          # column 1 (char 0)", which says nothing about why the server never came up.
          if ! curl --max-time 20 --connect-timeout 5 -sf "$SERVER_URL/health" \
              -o "$RUNNER_TEMP/health.json"; then
            echo "::error::the server never answered /health; last 40 server log lines:"
            tail -40 "$RUNNER_TEMP/server.log" || true
            exit 1
          fi
          python -m json.tool "$RUNNER_TEMP/health.json"

      - name: Mint the fleet agent token
        # Agent tokens are mandatory (#125), so the consumer needs one before it
        # connects. Same bootstrap as `collector-e2e.yml`: mint one fleet token with
        # the admin password, mask it, and hand it to the consumer, which reads it
        # from the environment (`server-authorization: env-var`) rather than from a
        # committed file.
        run: |
          TOKEN=$(curl -sf -u "admin:$ADMIN_PASSWORD" \
            -H 'Content-Type: application/json' \
            -d '{"label":"fluentbit-ci","max_agents":5}' \
            "$SERVER_URL/agent-tokens" \
            | python -c 'import json, sys; print(json.load(sys.stdin)["token"])')
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "OPAMP_AGENT_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Install Fluent Bit
        # Pick the package by the runner's own architecture. The old arm64-then-amd64
        # fallback could not work: the arm64 URL is a real file, so `curl` succeeded on
        # an amd64 runner and the `||` never fired. `dpkg` then refused the package and
        # `apt-get -f install` had nothing to fix.
        run: |
          ARCH=$(dpkg --print-architecture)
          curl --max-time 60 --connect-timeout 5 -fsSL -o fluent-bit.deb \
            "https://packages.fluentbit.io/ubuntu/noble/pool/main/f/fluent-bit/fluent-bit_${FLUENT_BIT_VERSION}_${ARCH}.deb"
          sudo dpkg -i fluent-bit.deb || sudo apt-get -f install -y
          # The package installs into `/opt/fluent-bit/bin` and puts nothing on PATH, so
          # `fluent-bit --version` exits 127 on a package that installed perfectly.
          # Ask dpkg where it went instead of hardcoding the prefix, and publish it for
          # the steps below — the supervisor launches Fluent Bit by name.
          BIN=$(dpkg -L fluent-bit | grep -E '/bin/fluent-bit$' | head -1)
          test -n "$BIN"
          BIN_DIR=${BIN%/*}
          echo "$BIN_DIR" >> "$GITHUB_PATH"
          export PATH="$BIN_DIR:$PATH"
          fluent-bit --version

      - name: Install the opamp-core consumer
        # The supervisor is a Python package (`opamp-observe/opamp-core`, `consumer/`).
        # The tag is `v0.6`, not the `v0.6.0` in the wheel's own version string — pinning
        # the version string made `pip` fail on a ref that does not exist.
        run: |
          python -m venv "$RUNNER_TEMP/oc"
          "$RUNNER_TEMP/oc/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/oc/bin/pip" install \
            "git+https://github.com/opamp-observe/opamp-core@${OPAMP_CORE_REF}#subdirectory=consumer"

      - name: Start the supervised agent
        # `Health_Check On` matters: without it Fluent Bit's `/api/v1/health` is 404, the
        # supervisor reports `healthy: false` forever, and every rollout pauses on
        # `unhealthy` — the finding recorded on #123. `agent_capabilities` is what makes
        # the consumer advertise `AcceptsRemoteConfig` at all (its defaults do not), and
        # `agent_additional_params` is required by its config loader (an omission the
        # loader reports as a plain exception, which the old `nohup &` swallowed).
        run: |
          mkdir -p "$RUNNER_TEMP/agent"
          cd "$RUNNER_TEMP/agent"
          cat > fluent-bit.conf <<'EOF'
          [SERVICE]
              Health_Check On
              Flush    2
              Daemon   off
              Log_Level info
              HTTP_Server On
              HTTP_Listen 0.0.0.0
              HTTP_Port 2020

          [INPUT]
              Name  dummy
              Tag   dummy

          [OUTPUT]
              Name  stdout
              Match *
          EOF
          cat > opamp.json <<EOF
          {
            "consumer": {
              "server_url": "http://localhost",
              "server_port": 4320,
              "client_status_port": 2020,
              "transport": "http",
              "server-authorization": "env-var",
              "service_type": "fluentbit",
              "agent_config_path": "./fluent-bit.conf",
              "agent_additional_params": [],
              "processTracking": "Supervisor",
              "heartbeat_frequency": 5,
              "agent_capabilities": ["AcceptsRemoteConfig", "ReportsHeartbeat", "ReportsEffectiveConfig"],
              "log_level": "info"
            }
          }
          EOF
          # Not detached from the step's failure: a consumer that cannot start is a
          # failed step, and the log tail below is the evidence. `env` rather than an
          # `export` because the variable the consumer's `env-var` auth mode reads is
          # literally named `OpAMP-token`.
          env "OpAMP-token=$OPAMP_AGENT_TOKEN" \
            nohup "$RUNNER_TEMP/oc/bin/opamp-consumer" --config-path ./opamp.json \
            > "$RUNNER_TEMP/consumer.log" 2>&1 &
          for _ in $(seq 30); do
            curl --max-time 5 -sf "http://127.0.0.1:2020/api/v1/health" >/dev/null && break
            sleep 1
          done
          curl --max-time 5 -sf "http://127.0.0.1:2020/api/v1/health" \
            || { echo "::error::Fluent Bit's health API never came up"; tail -40 "$RUNNER_TEMP/consumer.log"; exit 1; }

      - name: Assert identity, inventory, and a pushed config the profile judged
        # The script polls for an agent the *server* resolved to `fluentbit` — a
        # dictionary regression that made this agent `generic` again fails here.
        run: |
          python scripts/fluentbit_e2e.py --server "$SERVER_URL" --password "$ADMIN_PASSWORD" --timeout 180

      - name: Server log
        if: always()
        run: cat "$RUNNER_TEMP/server.log" || true

      - name: Consumer log
        if: always()
        run: tail -200 "$RUNNER_TEMP/consumer.log" || true

      - name: Fleet as the server saw it
        if: always()
        run: curl --max-time 20 --connect-timeout 5 -s "$SERVER_URL/agents" | python -m json.tool || true
