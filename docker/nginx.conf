# TLS terminator example for the OpAMP server (#96).
#
#   browser / agent ──https/wss──▶ nginx ──http──▶ opamp-server:4320 (loopback)
#
# The server never speaks TLS itself; it trusts `TLS_TERMINATED_UPSTREAM=true`
# (or `PUBLIC_URL=https://…`) to know it is behind a terminator. Both are
# assertions, not enforcement — the proxy is the only thing that can make them
# true, so keep the server port bound to 127.0.0.1.
#
# Run with:  docker run -v $PWD/docker/nginx.conf:/etc/nginx/nginx.conf:ro \
#                      -v /etc/letsencrypt:/etc/nginx/certs:ro -p 443:443 nginx
#
# What matters here:
#   * Upgrade/Connection passthrough for the WebSocket transport (#89).
#   * Origin is forwarded untouched — CORSMiddleware does not apply to upgrades,
#     so server.ws.origin_allowed() is the only Origin check in the chain.
#   * Long read timeouts: agents hold the OpAMP connection open between polls and
#     a WebSocket can sit idle for minutes. A short timeout looks like "agents
#     keep reconnecting" and, worse, silently halves the value of the push path.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # The WebSocket upgrade needs an explicit Connection header, and it must be
    # `close` (not `upgrade`) for ordinary HTTP requests or nginx keeps the
    # upstream connection open forever.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream opamp_server {
        server 127.0.0.1:4320;
        keepalive 32;
    }

    server {
        listen 80;
        server_name opamp.example.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name opamp.example.com;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # OpAMP agents: HTTP polls and WebSocket upgrades on the same path.
        location /v1/opamp {
            proxy_pass http://opamp_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Origin $http_origin;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Idle sockets must outlive AGENT_TIMEOUT_SECONDS and the poll interval.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            # Never buffer a streaming/upgraded connection.
            proxy_buffering off;

            # Keep this above OPAMP_MAX_MESSAGE_BYTES (default 64 MiB).
            client_max_body_size 70m;
        }

        # API, metrics, /health and the docs.
        location / {
            proxy_pass http://opamp_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
            client_max_body_size 70m;
        }
    }
}
