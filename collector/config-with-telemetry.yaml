# Run it in a container:
#   docker run --rm -e OPAMP_SERVER_TOKEN=... \
#     -p 4347:4347 -p 4348:4348 \
#     -v "$PWD/collector/config-with-telemetry.yaml:/etc/otelcol-contrib/config.yaml:ro" \
#     -v "$PWD/collector/file.log:/var/log/collector/file.log:ro" \
#     otel/opentelemetry-collector-contrib:0.165.0
#
# The endpoint defaults are the container's view of this Mac
# (`host.docker.internal`; Docker Desktop provides it, Linux needs
# `--add-host=host.docker.internal:host-gateway`). A native run overrides them:
#   OPAMP_SERVER_URL=http://127.0.0.1:4320/v1/opamp \
#   OPAMP_METRICS_URL=http://127.0.0.1:4320/v1/metrics \
#   ./otelcol-contrib --config=collector/config-with-telemetry.yaml
#
# This file was captured as an *effective* config (every default spelled out),
# so a few keys are not accepted by the current collector and are removed:
# `protocols.http.transport`/`idle_timeout` (http has no transport; idle_timeout
# does not exist on this receiver) and `capabilities.accepts_restart_command`.
# `filelog` is renamed to `file_log` (the alias is deprecated), and receivers
# bind `0.0.0.0` so the published ports work from outside the container.
exporters:
  debug:
    sampling_initial: 2
    sampling_thereafter: 1
    use_internal_logger: true
    verbosity: Detailed
extensions:
  opamp:
    agent_description:
      include_resource_attributes: false
      non_identifying_attributes:
        agent.name: collector4
        description: foobar
        environment: development
    capabilities:
      reports_available_components: true
      reports_effective_config: true
      reports_health: true
    ppid: 0
    ppid_poll_interval: 5s
    server:
      http:
        polling_interval: 5s
        endpoint: ${env:OPAMP_SERVER_URL:-http://host.docker.internal:4320/v1/opamp}
        headers:
          Authorization: "Bearer ${env:OPAMP_SERVER_TOKEN}"
processors:
  batch:
    metadata_cardinality_limit: 1000
    metadata_keys: []
    send_batch_max_size: 0
    send_batch_size: 8192
    timeout: 200ms
receivers:
  file_log:
    include: ["/var/log/collector/file.log"]
    start_at: beginning
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4347
        keepalive: {}
        read_buffer_size: 524288
        transport: tcp
      http:
        endpoint: 0.0.0.0:4348
        logs_url_path: /v1/logs
        metrics_url_path: /v1/metrics
        read_header_timeout: 0s
        traces_url_path: /v1/traces
        write_timeout: 0s
service:
  extensions:
  - opamp
  pipelines:
    traces:
      receivers:
      - otlp
      processors:
      - batch
      exporters:
      - debug
    logs:
      receivers:
        - file_log
      exporters:
        - debug
  telemetry:
    metrics:
      level: detailed
      readers:
      - periodic:
          exporter:
            otlp:
              protocol: http/protobuf
              endpoint: ${env:OPAMP_METRICS_URL:-http://host.docker.internal:4320/v1/metrics}