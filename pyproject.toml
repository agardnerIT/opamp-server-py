[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opamp-server-py"
version = "0.1.0"
description = "OpenTelemetry OpAMP server with OPA compliance, OCB manifest generation, an opampctl CLI, and an AI-agent-friendly REST API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Adam Gardner" }]
keywords = ["opamp", "opentelemetry", "otel", "collector", "compliance", "opa"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "fastapi[standard]>=0.116.0",
    "loguru>=0.7.0",
    "prometheus_client>=0.22.0",
    "uvicorn[standard]",
    "protobuf>=7.34.1,<8",  # floor = gencode version in proto/*_pb2.py (protoc 34.1)
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "cryptography>=42.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
# MCP server surface (FastMCP) for AI agents — `pip install opamp-server-py[mcp]`
# Pinned <2: mcp 2.x renamed FastMCP to MCPServer (breaking API change).
mcp = ["mcp>=1.27.0,<2"]
# Streamlit UI — `pip install opamp-server-py[ui]`
ui = [
    "streamlit>=1.40.0",
    "pandas>=2.0.0",
]
# Observability — OTLP traces and HTTP instrumentation (#108):
# `pip install -e ".[observability]"`, then OPAMP_TRACING_ENABLED=true.
observability = [
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
]
# Dev/test — `pip install -e .[dev]`
dev = [
    "pytest>=8.0.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
opampctl = "cli.main:app"
opamp-mcp = "mcp_server.server:main"

[project.urls]
Homepage = "https://github.com/agardnerIT/opamp-server-py"
Issues = "https://github.com/agardnerIT/opamp-server-py/issues"

[tool.setuptools]
# Discovered, not listed: `server.profiles` (#118/#117h) is a subpackage carrying a
# dictionary of YAML files, and a hand-maintained `packages = [...]` list quietly
# omitted it from a non-editable install. `pip install -e .` hid that; a wheel would
# have shipped a server that cannot import its own profiles.
packages = { find = { include = ["client*", "cli*", "server*", "proto*", "mcp_server*"] } }

[tool.setuptools.package-data]
# The profile dictionary is the source of truth for agent types (#117h): a wheel that
# drops these files serves every agent as `generic`.
"server.profiles" = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
