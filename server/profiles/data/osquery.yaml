# osquery — the second non-collector profile, and the first that speaks JSON (#141).
#
# Written from the payload the issue recorded (osqueryd 5.24.0 through
# `agardnerit/osquery-opamp` 0.1.0) plus the osquery facts this repository already
# encodes: the extension reports its config as `application/json` under the object key
# `osquery.json` (it refuses any other key), and `schedule.<query name>` is an address
# that collides with a local config source (#131/#119).

name: osquery
display_name: osquery
icon: "🔎"
priority: 80
summary: >-
  osquery JSON: scheduled queries and packs are read from the config document the
  extension reports, structural validation covers the JSON config shape, and the
  collector-specific reports and telemetry views do not describe it.

config_formats:
  # `application/json` is what the extension declares. It is a *format*, not a product,
  # so it is not distinctive: every agent may hand this server a JSON object, and only
  # this profile's engine judges whether the object is an osquery config.
  - content_types:
      - application/json
      - text/json
    default_filename: osquery.json
    distinctive: false

# The rules are osquery's own (`schedule`, `packs`, `options`), and the inventory comes
# from the live config because the extension reports no `AvailableComponents` (#141).
validates_structure: true
structure:
  engine: osquery
  # Two config sources scheduling the same query name is a merge conflict — osquery
  # reports `config_conflict` rather than overriding, exactly like a duplicate component
  # id in a collector (#119).
  address_sections: [schedule, packs]
components_engine: osquery

identity:
  match_any:
    # The spec's convention: `service.name` names the agent type. The issue's captured
    # payload reports `service.name: osqueryd`.
    - attr: service.name
      prefix:
        - osqueryd
    # And the extension labels its whole payload namespace `osquery.`. No other product
    # has a reason to do that, so a single attribute key is evidence even when
    # `service.name` is renamed — which is why the profile matches on the **key** here
    # rather than enumerating a dozen values that will change between releases.
    - attr_prefix: "osquery."

# Neither fleet report applies: "heavy" counts *unused* components and every scheduled
# query came from the live config, and "outdated" needs component versions osquery does
# not report. Both skip this profile by declaration and say so (#120).
reports: [fleet, agent]

# No telemetry block: osquery does not push OTLP to this server, and a panel of empty
# tiles would be a lie (#121/#122).

guidance: >-
  The extension, not this server, owns the daemon: it reports what osquery is running
  and hands it a merged config. The object name is part of the contract — a push must
  use **`osquery.json`** with `application/json`; the extension refuses any other key and
  reports FAILED, which pauses the rollout. Structural checks here are best effort: the
  rules read the JSON document's shape (`schedule`, `packs`, `options`), but this server
  cannot run `osqueryd --config_check` on the agent host, so an approver is the last
  check. osquery merges every config source it is handed, so a query name already
  scheduled by a local file is a conflict, not an override: remove it from one source
  before pushing.

# There is no `onboarding_snippet`: the endpoint and credential live in the OpAMP
# extension's own configuration, not in `osquery.json`, so this server has no complete
# file it can honestly write for a new agent (#121). The bootstrap block below is what
# an operator actually needs, and since #144 it is the extension's own quickstart
# (github.com/agardnerIT/osquery-opamp) with the endpoint and token substituted — not a
# paraphrase of it. That is the point of choosing an agent type when minting a token:
# an osquery fleet is handed osquery instructions.
snippet: |
  # osquery does not speak OpAMP itself: the osquery-opamp extension does, and osqueryd
  # keeps running its own config file. Point the extension at this server, hand it the
  # credential, and it merges what this server pushes into the live schedule.
  #
  #   git clone https://github.com/agardnerIT/osquery-opamp
  #   cd osquery-opamp
  #   python -m venv .venv && source .venv/bin/activate
  #   sudo .venv/bin/python -m osquery_opamp \
  #        --endpoint {endpoint} \
  #        --header 'Authorization: Bearer {token}'
  #
  # `--header` is how the credential is presented, and the endpoint's scheme picks the
  # transport: http:// polls, ws:// lets this server push without waiting for a poll.
  # The extension registers with an osqueryd that is already running.
  #
  # That is push mode, the quickstart: the daemon keeps --config_plugin=filesystem and a
  # restart forgets what was pushed. To make this server the source of truth, run
  # osqueryd in pull mode instead (both flags are required — without
  # --extensions_require osqueryd exits with "Unknown registry plugin: opamp"):
  #
  #   osqueryd --config_plugin=opamp --extensions_require=opamp --extensions_timeout=30
  #
  # A pushed config must be the object "osquery.json" (content type application/json),
  # because that is the name the extension applies and reports.
