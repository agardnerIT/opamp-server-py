# Docker-runnable version of `config-with-telemetry.yaml` for a first connect.
#
# That file is a *captured effective config* (every default spelled out, e.g.
# `ppid: 0`, `transport: tcp`, `idle_timeout`) — the collector will not load it
# as a bootstrap config, and its `127.0.0.1` endpoints point at the container
# itself rather than your Mac. This file keeps the same identity and pipelines
# and fixes only what running in a container requires:
#
#   - `host.docker.internal` = the host as seen from the container
#     (Docker Desktop provides it; on Linux add
#     `--add-host=host.docker.internal:host-gateway`)
#   - the token comes from `OPAMP_SERVER_TOKEN` (`-e`), never from this file
#   - receivers bind `0.0.0.0` so published ports work, and filelog reads a
#     mounted path
#
# Run it with:
#   docker run --rm \
#     -e OPAMP_SERVER_TOKEN="$OPAMP_SERVER_TOKEN" \
#     -p 4317:4317 -p 4318:4318 \
#     -v "$PWD/collector/config-with-telemetry-docker.yaml:/etc/otelcol-contrib/config.yaml:ro" \
#     -v "$PWD/collector/file.log:/var/log/collector/file.log:ro" \
#     otel/opentelemetry-collector-contrib:0.165.0

extensions:
  opamp:
    server:
      http:
        endpoint: http://host.docker.internal:4320/v1/opamp
        polling_interval: 5s
        headers:
          Authorization: "Bearer ${env:OPAMP_SERVER_TOKEN}"
    agent_description:
      non_identifying_attributes:
        agent.name: collector4
        description: foobar
        environment: development
    capabilities:
      reports_health: true
      reports_effective_config: true
      reports_available_components: true

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # 0.165 renamed the alias: `file_log` (using `filelog` logs a deprecation warning).
  file_log:
    include: ["/var/log/collector/file.log"]
    start_at: beginning

processors:
  batch:
    timeout: 200ms

exporters:
  debug:
    verbosity: detailed

service:
  extensions: [opamp]
  # Collector self-telemetry, as in the original file: the server's
  # unauthenticated OTLP endpoint stores the latest gauges per agent.
  telemetry:
    metrics:
      level: detailed
      readers:
        - periodic:
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: http://host.docker.internal:4320/v1/metrics
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [file_log]
      processors: [batch]
      exporters: [debug]
