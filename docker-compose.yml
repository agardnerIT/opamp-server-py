# Secure-by-default deployment template.
#
# Configuration lives in `.env` (start from `.env.sample`); this file only wires the
# services together and pins the two facts a container cannot read from it. With no
# .env the app's own defaults apply: read-only until a credential exists, a random
# admin password generated on first boot, config push off, agent tokens required.
# See README → "Before you expose this server".
#
# NOTE: Image tags are pinned to the release these compose files ship with.
# Current version: 0.0.6
version: '3.8'

services:
  server:
    image: ghcr.io/agardnerit/opamp-server-py-server:0.0.6
    container_name: opamp-server
    # Bound to loopback on purpose: this port speaks plain HTTP and accepts
    # unauthenticated OpAMP agents. To expose it, put a TLS terminator in front
    # of it (docker/nginx.conf or docker/Caddyfile), set PUBLIC_URL=https://<host>
    # (or TLS_TERMINATED_UPSTREAM=true) and, if you must, change the host side
    # of this mapping to 0.0.0.0 and firewall 4320 to the proxy only.
    ports:
      - "127.0.0.1:4320:4320"
    # `.env` is the single source of truth for configuration. The whole file is
    # passed in (`env_file`), so every setting documented in `.env.sample` reaches
    # the server whether or not it is named below — including the ones a
    # hand-maintained list eventually drops (CONFIG_AT_REST_KEY, the CONFIG_PUSH_*
    # bounds, OPAMP_AUDIT_*, UPDATE_CHECK...).
    #
    # `environment:` is therefore almost empty on purpose. It holds only what a
    # container cannot take from `.env`: its own bootstrap and its own topology.
    # Auth, TLS posture, timeouts, logging, tracing and retention all live in
    # `.env`, where they are documented, and the app already defaults to the same
    # secure values, so nothing here needs restating. A setting in two places is a
    # setting that will disagree with itself — see README → "Environment Variables".
    env_file:
      - path: .env
        required: false
    environment:
      # Docker bootstrap, not a setting to configure here: a container that starts
      # with no password is read-only, and `docker compose up` would then have no way
      # in on a fresh clone. `.env` still wins — set
      # OPAMP_ADMIN_AUTOGENERATE_PASSWORD=false there and the server stays read-only.
      - OPAMP_ADMIN_AUTOGENERATE_PASSWORD=${OPAMP_ADMIN_AUTOGENERATE_PASSWORD:-true}
    volumes:
      # SQLite lives on a **named volume**, not a bind mount (#132).
      #
      # `./data:/app/data` is the obvious thing to write and it corrupts the database on
      # Docker Desktop for macOS: virtiofs does not implement POSIX locking and `mmap`
      # the way SQLite requires, so the server can see `database disk image is
      # malformed` / `disk I/O error` while `PRAGMA integrity_check` on the same file
      # from the host returns ok, and every write answers 503 until a restart re-reads
      # the WAL — which is exactly one restart later than the next corruption. A named
      # volume is an ext4 directory inside the VM, so this cannot happen.
      #
      # The cost is that `./data` is no longer where the files are. Get them out with
      # `docker compose cp server:/app/data/opamp.db data/` when `opampctl --db` needs
      # the live database offline. See README → "If every write answers 503".
      - opamp-data:/app/data
    networks:
      - opamp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4320/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  ui:
    image: ghcr.io/agardnerit/opamp-server-py-ui:0.0.6
    container_name: opamp-ui
    # Loopback on purpose. Streamlit is a server-side admin console that holds a live
    # session token (#105) and has no TLS of its own, and the XSRF/CORS posture in
    # `.streamlit/config.toml` assumes a same-origin browser. To serve it remotely, put
    # the TLS proxy in front of it (docker/nginx.conf or docker/Caddyfile) and keep
    # 8501 unpublished.
    ports:
      - "127.0.0.1:8501:8501"
    # Same `.env` as the server. The two entries below are the exception, because
    # they describe this compose stack rather than the deployment: where the UI
    # writes, and which host the API answers on. Taking them from `.env` would put
    # the `SERVER_ADDRESS=localhost` of a local run inside `opamp-network` and point
    # the UI at itself. Compose wins over `env_file` for exactly these two; the
    # scheme and port need no entry since the UI defaults to `http` and `4320`.
    env_file:
      - path: .env
        required: false
    environment:
      # The server is a service name inside the compose network, never localhost.
      # A `SERVER_ADDRESS` in `.env` is ignored here on purpose.
      - SERVER_ADDRESS=server
      # The UI imports server helpers (posture, manifests, reports) that create
      # their SQLite stores at import. The real data volume is read-only, so use
      # a throwaway writable directory; the UI reads fleet data over HTTP. A
      # `DATA_DIR` in `.env` (e.g. `data`) is ignored here on purpose.
      - DATA_DIR=/tmp/opamp-ui-data
    volumes:
      # Read-only, and the same named volume the server writes: the UI imports
      # server-side helpers (reports, manifests, posture) that resolve DATA_DIR. It
      # never writes, and it does **not** read the admin credential from here — signing
      # in exchanges a password for a session token and the password is discarded
      # (#105). A host path here would re-introduce the bind mount the server just
      # stopped using (#132).
      - opamp-data:/app/data:ro
    depends_on:
      server:
        condition: service_healthy
    networks:
      - opamp-network
    restart: unless-stopped

  # Optional TLS terminator. Uncomment with a docker/Caddyfile or the nginx
  # example in docker/nginx.conf, and set PUBLIC_URL=https://<host> for the
  # server. The WebSocket upgrade (#89) needs Upgrade/Connection passthrough and
  # a long read timeout — both examples show it.
  # proxy:
  #   image: caddy:2-alpine
  #   container_name: opamp-proxy
  #   ports:
  #     - "443:443"
  #     - "80:80"
  #   volumes:
  #     - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
  #     - ./data/caddy:/data
  #   depends_on:
  #     server:
  #       condition: service_healthy
  #   networks:
  #     - opamp-network
  #   restart: unless-stopped

  # Optional: OPA for compliance checking
  # If you enable this, set OPA_ENABLED=true and OPA_URL=http://opa:8181 in .env
  # (the container's own default is http://localhost:8181, which is not where the
  # OPA container is).
  # opa:
  #   image: openpolicyagent/opa:latest
  #   container_name: opamp-opa
  #   ports:
  #     - "127.0.0.1:8181:8181"
  #   volumes:
  #     - ./policies:/policies:ro
  #   command:
  #     - "run"
  #     - "--server"
  #     - "--addr=:8181"
  #     - "/policies"
  #   networks:
  #     - opamp-network
  #   restart: unless-stopped
  #   profiles:
  #     - opa

  # Optional: webhook.site for testing webhooks
  # Uncomment the service below to include a built-in webhook testing endpoint
  # available on port 8084. Useful for testing alert webhooks without external services.
  # webhook:
  #   image: webhooksite/webhook-server:latest
  #   container_name: opamp-webhook
  #   ports:
  #     - "127.0.0.1:8084:8084"
  #   environment:
  #     - WEBHOOK_PORT=8084
  #   networks:
  #     - opamp-network
  #   restart: unless-stopped

networks:
  opamp-network:
    driver: bridge

volumes:
  # The database volume (#132). Named, not bound: see the note on the server's
  # `volumes:` above. `docker compose down -v` deletes it (and the admin password with
  # it), so that flag is a deliberate "start over" — plain `down` keeps it.
  opamp-data:
