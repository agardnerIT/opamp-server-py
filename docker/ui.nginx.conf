# The OpAMP Console (web/) as a static bundle behind nginx.
#
#   browser ──http──▶ opamp-ui (nginx:80)  ──/api──▶  opamp-server:4320
#
# Replaces the Streamlit `ui` service at the 2027-ui / new-ui-plans stage-10
# cutover. There is no application server here on purpose: the console is a
# React SPA, so the only server-side decisions left are caching, the SPA
# fallback, and where /api goes.
#
# Why /api rather than a second origin: the admin session is an httpOnly cookie
# the server sets on POST /auth/session. Proxying /api through this server keeps
# the cookie same-site and same-origin (`Secure` when the browser arrives over
# TLS), so CORS never enters the picture for the console. `proxy_pass` below has
# a trailing slash, which strips the /api prefix: the FastAPI app serves
# /auth/session, not /api/auth/session.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A TLS terminator sits in front (docker/nginx.conf or docker/Caddyfile), so
    # the scheme the browser used arrives as X-Forwarded-Proto from there to here
    # and onwards to the server. Nothing is redirected to https here: this
    # container speaks http only, on loopback.

    # index.html names content-hashed assets, so a cached copy pins a browser to
    # a build whose files no longer exist after an upgrade — the white-screen
    # failure mode. Never cache the shell; always cache the assets it names.
    location = /index.html {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://server:4320/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Config push bodies are secrets (#98); they travel over this hop into the
        # server's own redaction/crypto path and are never logged by nginx (the
        # default access log records the request line, not the body).
        client_max_body_size 70m;
        # Reports and fleet queries are generated server-side; a slow one is not a
        # dead one. The WebSocket transport (/v1/opamp) is NOT proxied here — it
        # is an agent path and belongs to the terminator, not the console.
        proxy_read_timeout 120s;
    }

    # Every route is a client-side path (/agents, /agents/<id>, /remote-config…).
    # A deep link must serve the shell, which then routes; a 404 from nginx would
    # make a bookmark to /agents look like a broken deployment.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The console has no server-side errors of its own, but nginx's default pages
    # advertise its version. Keep responses boring.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # No CSP here: the bundle is built by Vite, and a wrong CSP breaks the console
    # silently in the browser rather than in CI. If one is added it needs its own
    # test against a built bundle, not a copied header.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
